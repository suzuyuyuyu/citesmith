<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Citesmith 設定</title>
  <link rel="stylesheet" href="./style/popup.css">
</head>
<body>
  <header><h1><img src="./assets/svg/logo.svg" alt="Citesmith"> settings</h1></header>
  <main>
    <form class="settings-area">
      <div class="form-group">
        <label for="filenameFormat">ファイル名の書式</label>
        <input type="text" id="filenameFormat" name="filenameFormat" spellcheck="false">
      </div>
      <div class="form-group">
        <label for="downloadFolder">保存先フォルダ（ダウンロードフォルダ内、空欄でそのまま）</label>
        <input type="text" id="downloadFolder" name="downloadFolder" spellcheck="false" placeholder="papers/${journal}">
      </div>
      <div class="form-group">
        <label for="citationKeyFormat">引用キーの書式</label>
        <input type="text" id="citationKeyFormat" name="citationKeyFormat" spellcheck="false">
      </div>
      <a class="help-link" href="./help.html" target="_blank">書式のプレースホルダー一覧</a>
      <label class="checkbox"><input type="checkbox" name="downloadPdf" checked>PDF をダウンロード</label>
      <label class="checkbox"><input type="checkbox" name="copyBibtex" checked>BibTeX をコピー</label>
      <div class="save-group">
        <button id="saveButton" type="submit">保存</button>
        <div id="statusMessage" class="status" role="status"></div>
      </div>
    </form>
  </main>
  <footer>
    <img src="./assets/svg/icon-logo.svg" alt="Citesmith" class="footer-logo">
    <p class="help-text">© 2026 Yuta Suzuki</p>
  </footer>
  <script type="module" src="./script/popup.js"></script>
</body>
</html>
