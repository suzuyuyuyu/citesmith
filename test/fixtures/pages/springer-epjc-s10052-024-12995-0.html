<meta name="dc.description" content="We extend a recently proposed framework, dubbed inflation by supersymmetry breaking, to hybrid inflation by introducing a waterfall field that allows to decouple the supersymmetry breaking scale in the observable sector from the inflation scale, while keeping intact the inflation sector and its successful predictions: naturally small slow-roll parameters, small field initial conditions and absence of the pseudo-scalar companion of the inflaton, in terms of one free parameter which is the first order correction to the inflaton Kähler potential. During inflation, supersymmetry is spontaneously broken with the inflaton being the superpartner of the goldstino, together with a massive vector that gauges the R-symmetry. Inflation arises around the maximum of the scalar potential at the origin where R-symmetry is unbroken. Moreover, a nearby minimum with tuneable vacuum energy can be accommodated by introducing a second order correction to the Kähler potential. The inflaton sector can also play the role of the supersymmetry breaking ‘hidden’ sector when coupled to the (supersymmetric) Standard Model, predicting a superheavy superparticle spectrum near the inflation scale. Here we show that the introduction of a waterfall field provides a natural way to end inflation and allows for a scale separation between supersymmetry breaking and inflation. Moreover, the study of the global vacuum describing low energy Standard Model physics can be done in a perturbative way within a region of the parameter space of the model.">
