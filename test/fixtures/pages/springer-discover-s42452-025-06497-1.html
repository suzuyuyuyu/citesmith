<meta name="dc.description" content="X-ray Computed Tomography (CT) is used to recover the true surfaces of fluid channels and is fed to a simulation tool (ANSYS) to create an accurate cyber environment. The simulation tool also receives CT-assisted multiphase fluid profiles (belonging to the instance just before the flow starts) as an initial condition. This unique methodology is made possible by using a novel in-situ compact adaptor design is used to create fluid channels that can be placed inside any industrial X-ray CT and fulfill the above objective. It is integrated with an Android-based app to control the flow once placed inside CT. It is portable and compact enough (a) to be placed inside various experimental environments and (b) modular enough to be mounted with multimodal systems simultaneously. Two key parameters, (a) spatial distribution and (b) the air volume fraction, are measured using two different non-invasive imaging modalities: (a) Electrical Impedance Tomography (EIT) and (d) X-ray Computed Tomography (CT). Simulated outcomes are correlated with the experimental outcomes from both EIT and X-ray CT, showing an agreement of 85 to 98 percent, respectively. Time-averaged electrically conductive fluid flow profile obtained by EIT shows a match with the mass-attenuated fluid profile obtained by X-ray CT, justifying the utility of an in-situ adaptor. X-ray CT assistance for CFD studies may be replaced by EIT assistance as (a) scanning time may be relatively lower, (b) it does not require rotations, (c) economical, and (d) fluid channels need not be placed inside of shielded compartment thus improving practicality. The data of analysis is shared in this work. Multimodal non-invasive imaging provides multiphase flow information; it also differentiates conductive and mass-attenuated multiphase profiles at common cross-sections.">
